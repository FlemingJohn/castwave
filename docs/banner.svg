  <rect width="1280" height="400" rx="24" fill="url(#glow-right)"/>
  <rect width="1280" height="400" rx="24" filter="url(#grain)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="#2e2b4a"/>

  <g transform="translate(72 84)">
