<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Castwave: paste anything, hear it performed">
  <defs>
    <radialGradient id="glow" cx="0.12" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#e6c4ef" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#8f89f2" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#5b55db" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#12111c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0.92" cy="1" r="0.6">
      <stop offset="0" stop-color="#5b55db" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12111c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile" cx="0.2" cy="0.15" r="1.05">
      <stop offset="0" stop-color="#e6c4ef"/>
      <stop offset="0.38" stop-color="#8f89f2"/>
      <stop offset="0.7" stop-color="#5b55db"/>
      <stop offset="1" stop-color="#2b2770"/>
