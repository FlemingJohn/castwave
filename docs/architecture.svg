  <text font-family="'Hanken Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#aba6cb"><tspan x="1006" y="475">keeps both API keys</tspan><tspan x="1006" y="491">on the server</tspan></text>
